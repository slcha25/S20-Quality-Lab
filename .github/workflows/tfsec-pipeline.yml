name: Security Quality Gate
on:
  push:
    branches:
      - main
jobs:
  tfsec_scan:
    name: tfsec SAST Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run tfsec
        uses: aquasecurity/tfsec-pr-commenter-action@v1.2.0
        with:
          # Remove --soft-fail=false, use only what you need
          tfsec_args: --soft-fail  # This will NOT fail the pipeline on findings
          github_token: ${{ secrets.GITHUB_TOKEN }}